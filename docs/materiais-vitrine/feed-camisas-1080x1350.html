<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Camisas — rascunho local 1080x1350</title>
<!-- RASCUNHO LOCAL PARA APROVAÇÃO. Não postar. Sem preços, sem promessas.
     As fotos reais estão no R2 e não existem em disco: abra com ?base=https://URL-PUBLICA-DO-SITE/ (com barra final)
     para carregar as imagens do próprio catálogo. Sem ?base= os quadros mostram só a referência. -->
<style>
*{box-sizing:border-box;margin:0}body{background:#222;display:grid;place-items:center;min-height:100vh}
.art{width:1080px;height:1350px;background:#050505;color:#F2EFE9;font-family:Manrope,Inter,Arial,sans-serif;padding:72px;display:flex;flex-direction:column;border:1px solid #B8965A33}
.eyebrow{color:#B8965A;letter-spacing:.28em;font-size:26px;text-transform:uppercase}
h1{font-size:76px;line-height:1.05;margin:22px 0 14px;letter-spacing:.02em}
.rule{width:96px;height:2px;background:#B8965A;margin:10px 0 40px}
.grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(1,1fr);gap:22px;min-height:0}
figure{background:#101010;border:1px solid #3d362b;display:flex;flex-direction:column;min-height:0}
.ph{flex:1;min-height:0;background:#171717;display:grid;place-items:center;color:#B8965A;font-size:30px;letter-spacing:.12em}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
figcaption{padding:16px 20px;font-size:26px;line-height:1.3}figcaption b{display:block;font-weight:700}figcaption span{color:#E1C98D;font-size:22px;letter-spacing:.1em}
footer{margin-top:34px;display:flex;justify-content:space-between;align-items:end;color:#bdbdb7;font-size:26px}footer b{color:#E1C98D;letter-spacing:.2em;font-size:28px}
</style></head><body>
<main class="art" aria-label="Camisas">
<div class="eyebrow">Seleção Portela</div><h1>Camisas</h1><div class="rule"></div>
<div class="grid" id="grid"></div>
<footer><b>PORTELA CULTURE</b><span>Disponível sob encomenda · Consulte pelo WhatsApp</span></footer>
</main>
<script>
const base=new URLSearchParams(location.search).get('base')||'';
const items=[{"id":"PC-474","nome":"Gucci — Polo","marca":"Gucci","src":"media/catalogo/gucci/244998797/capa.webp"},{"id":"PC-2809","nome":"Nike — Camisa de manga longa","marca":"Nike","src":"media/catalogo/colecao-20261010/PC-2809/001.webp"}];
const grid=document.getElementById('grid');
for(const it of items){const f=document.createElement('figure'),ph=document.createElement('div'),c=document.createElement('figcaption');ph.className='ph';
 if(base){const i=new Image();i.alt=it.nome+' — '+it.id;i.src=base+it.src;i.onerror=()=>{i.remove();ph.textContent=it.id};ph.append(i);}else ph.textContent=it.id;
 c.innerHTML='<b></b><span></span>';c.firstChild.textContent=it.nome;c.lastChild.textContent=it.marca;f.append(ph,c);grid.append(f);}
</script></body></html>
