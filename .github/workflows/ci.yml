name: Portela CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate artifact
        run: node scripts/validate-artifact.mjs

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: portela-culture-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
